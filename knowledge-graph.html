<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oktavia Portfolio - Knowledge graph (living constellation)</title>
<meta name="description" content="An interactive 3D constellation of the institutional memory: AI colleagues, PortCos, bottlenecks, interventions, and playbooks, and how they connect." />

<!-- Fonts: Instrument Serif display + IBM Plex Sans body + IBM Plex Mono labels -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

<!-- Shared preview-site design system (amber accent, dark navy canvas, brand fonts) -->
<link rel="stylesheet" href="style.css" />

<!-- Graph engine: standalone 3d-force-graph UMD (bundles three.js), pinned. -->
<!-- three-spritetext is loaded as ESM inside the module script below. -->
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.0/dist/3d-force-graph.min.js"></script>

<style>
  /* ---- Page-local layout ---- */
  html, body { height: 100%; }
  body { overflow: hidden; background: #0a0e1c; }

  .kg-app {
    position: fixed;
    inset: 0;
    z-index: 2;
    height: 100%;
  }

  /* ---- The 3D stage fills the viewport ---- */
  #kgGraph {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  #kgGraph canvas { display: block; outline: none; }

  /* ---- Headline strip (overlay, top) ---- */
  .kg-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.7rem 1.1rem;
    padding: 0.7rem clamp(0.8rem, 3vw, 1.5rem);
    background: oklch(0.10 0.018 260 / 0.62);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line-soft);
    pointer-events: none;
  }
  .kg-bar > * { pointer-events: auto; }

  .kg-title {
    display: inline-flex;
    align-items: baseline;
    gap: 0.55rem;
    font-family: var(--font-display);
    font-size: clamp(1.1rem, 0.9rem + 1vw, 1.5rem);
    letter-spacing: 0.01em;
    color: var(--ink);
    white-space: nowrap;
  }
  .kg-title small {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ---- Live counts per kind ---- */
  .kg-counts {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .kg-count {
    display: inline-flex;
    align-items: center;
    gap: 0.42rem;
    font-family: var(--font-mono);
    font-size: 0.66rem;
    letter-spacing: 0.03em;
    color: var(--ink-dim);
    padding: 0.26rem 0.58rem;
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    background: oklch(0.16 0.02 260 / 0.45);
  }
  .kg-count .swatch {
    width: 15px;
    height: 10px;
    flex: none;
    border-radius: 3px;
  }
  .kg-count .num {
    color: var(--ink);
    font-weight: 500;
  }

  /* ---- Search (top-left area of the bar, pushed right via margin) ---- */
  .kg-search {
    margin-left: auto;
    position: relative;
    flex: 1 1 200px;
    max-width: 280px;
    min-width: 160px;
  }
  .kg-search input {
    width: 100%;
    box-sizing: border-box;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink);
    background: oklch(0.14 0.018 260 / 0.85);
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    padding: 0.5rem 0.85rem;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .kg-search input::placeholder { color: var(--ink-faint); }
  .kg-search input:focus {
    border-color: var(--accent-line);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .kg-suggest {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 30;
    list-style: none;
    margin: 0;
    padding: 0.25rem;
    background: oklch(0.13 0.018 260 / 0.97);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow);
    max-height: 280px;
    overflow-y: auto;
    display: none;
  }
  .kg-suggest.is-open { display: block; }
  .kg-suggest li {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.55rem;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--ink-dim);
  }
  .kg-suggest li:hover, .kg-suggest li.is-active {
    background: var(--accent-soft);
    color: var(--ink);
  }
  .kg-suggest li .dot {
    width: 9px; height: 9px; border-radius: 50%; flex: none;
  }
  .kg-suggest li .k {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ---- Legend (always-on, bottom-left) ---- */
  .kg-legend {
    position: absolute;
    left: clamp(0.6rem, 2vw, 1.1rem);
    bottom: clamp(0.6rem, 2vw, 1.1rem);
    z-index: 12;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    padding: 0.75rem 0.85rem;
    background: oklch(0.11 0.018 260 / 0.78);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    backdrop-filter: blur(10px);
    max-width: 230px;
  }
  .kg-legend h4 {
    margin: 0 0 0.15rem;
    font-family: var(--font-mono);
    font-size: 0.56rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 500;
  }
  .kg-legend .row {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-size: 0.76rem;
    color: var(--ink-dim);
  }
  .kg-legend .dot {
    width: 12px; height: 12px; flex: none;
    border-radius: 50%;
    box-shadow: 0 0 8px 1px currentColor;
  }
  .kg-legend .hint {
    margin-top: 0.25rem;
    font-size: 0.66rem;
    color: var(--ink-faint);
    line-height: 1.45;
  }

  /* ---- Controls cluster (bottom-left, under legend) ---- */
  .kg-controls {
    position: absolute;
    left: clamp(0.6rem, 2vw, 1.1rem);
    bottom: clamp(0.6rem, 2vw, 1.1rem);
    z-index: 13;
    display: none; /* shown after legend height is known; we just stack via order below */
  }

  .kg-reset {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    background: oklch(0.13 0.018 260 / 0.85);
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    padding: 0.42rem 0.8rem;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .kg-reset:hover { border-color: var(--accent-line); color: var(--ink); }

  /* The legend hosts the reset button at its foot so they stack cleanly. */
  .kg-legend .kg-reset { margin-top: 0.35rem; align-self: flex-start; }

  /* ---- Inspector (right side, plain DOM) ---- */
  .kg-inspector {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(380px, 88vw);
    z-index: 20;
    transform: translateX(102%);
    transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    flex-direction: column;
    background: oklch(0.10 0.018 260 / 0.94);
    border-left: 1px solid var(--line);
    backdrop-filter: blur(16px);
    box-shadow: -28px 0 80px -40px rgba(0,0,0,0.85);
  }
  .kg-inspector.is-open { transform: none; }

  .kg-insp-head {
    padding: 1.1rem 1.2rem 0.9rem;
    border-bottom: 1px solid var(--line-soft);
    position: relative;
  }
  .kg-insp-kind {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 0.5rem;
  }
  .kg-insp-kind .dot { width: 9px; height: 9px; border-radius: 50%; }
  .kg-insp-name {
    font-family: var(--font-display);
    font-size: 1.6rem;
    line-height: 1.12;
    color: var(--ink);
  }
  .kg-insp-subtitle {
    margin-top: 0.3rem;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
  }
  .kg-insp-close {
    position: absolute;
    top: 0.9rem;
    right: 0.95rem;
    width: 30px; height: 30px;
    display: grid; place-items: center;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--ink-dim);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .kg-insp-close:hover { color: var(--ink); border-color: var(--accent-line); }

  .kg-insp-body {
    padding: 1.1rem 1.2rem 1.6rem;
    overflow-y: auto;
    flex: 1 1 auto;
  }
  .kg-insp-body p.copy {
    margin: 0 0 1.3rem;
    font-size: 0.92rem;
    line-height: 1.62;
    color: var(--ink-dim);
  }
  .kg-insp-body .empty {
    font-size: 0.84rem;
    color: var(--ink-faint);
    font-style: italic;
    margin-bottom: 1.3rem;
  }

  .kg-conn-group { margin-bottom: 1.2rem; }
  .kg-conn-group h5 {
    margin: 0 0 0.5rem;
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 500;
  }
  .kg-conn {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    width: 100%;
    text-align: left;
    background: oklch(0.15 0.02 260 / 0.6);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 0.55rem 0.65rem;
    margin-bottom: 0.4rem;
    cursor: pointer;
    color: var(--ink-dim);
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
  }
  .kg-conn:hover {
    border-color: var(--accent-line);
    background: oklch(0.17 0.02 260 / 0.75);
    transform: translateX(2px);
    color: var(--ink);
  }
  .kg-conn .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .kg-conn .label {
    font-size: 0.84rem;
    flex: 1 1 auto;
    line-height: 1.25;
  }
  .kg-conn .rel {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }

  /* ---- Footer pill (honest) ---- */
  .kg-foot {
    position: absolute;
    right: clamp(0.6rem, 2vw, 1.1rem);
    bottom: clamp(0.6rem, 2vw, 1.1rem);
    z-index: 12;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
    padding: 0.4rem 0.75rem;
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    background: oklch(0.11 0.018 260 / 0.82);
    backdrop-filter: blur(8px);
    transition: opacity 0.3s ease;
  }

  /* ---- Loading note ---- */
  .kg-loading {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .kg-loading.is-hidden { opacity: 0; }

  /* When inspector is open on a wide screen, nudge the footer pill clear of it */
  @media (min-width: 760px) {
    .kg-app.insp-open .kg-foot { right: calc(min(380px, 88vw) + 1.1rem); }
  }
  /* On small screens the inspector covers most of the stage, so hide floating bits */
  @media (max-width: 640px) {
    .kg-app.insp-open .kg-legend,
    .kg-app.insp-open .kg-foot { opacity: 0; pointer-events: none; }
    .kg-counts { display: none; }
  }
</style>
</head>

<body class="grain">

<div class="kg-app" id="kgApp">

  <!-- 3D stage -->
  <div id="kgGraph"></div>

  <!-- Headline strip: title, live counts, search -->
  <header class="kg-bar">

  <div class="kg-foot">Prototype, demo data.</div>
</div>

const KIND_LABELS = DATA.kind_labels;

/* Lane / display order for the legend and counts. */
const KIND_ORDER = ["agent", "portco", "bottleneck", "intervention", "playbook"];

/* A node is a bright cell body if it is an agent OR its degree is high. */
const SOMA_DEGREE = 4;

/* Per-kind label typography. Agents get a serif and larger text. */
const KIND_LABEL_FONT = {
  agent: "Instrument Serif, serif",
  portco: "IBM Plex Sans, sans-serif",
  playbook: "IBM Plex Sans, sans-serif",
  intervention: "IBM Plex Sans, sans-serif",
  bottleneck: "IBM Plex Sans, sans-serif"
};
const KIND_LABEL_HEIGHT = {
  agent: 5,
  portco: 3.6,
  playbook: 3.4,
  intervention: 3.4,
  bottleneck: 3.4
};

/* ---- Lookup tables ---- */
const NODE_BY_ID = {};
DATA.nodes.forEach(function (n) { NODE_BY_ID[n.id] = n; });

/* ---- Small HTML escaper for inspector copy ---- */
function escapeHtml(s) {
  if (s === undefined || s === null) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* ---- Build the live count strip ---- */
(function renderCounts() {
  const counts = {};
  KIND_ORDER.forEach(function (k) { counts[k] = 0; });
  DATA.nodes.forEach(function (n) {
    if (counts[n.kind] === undefined) counts[n.kind] = 0;
    counts[n.kind] += 1;
  });
  const host = document.getElementById("kgCounts");
  KIND_ORDER.forEach(function (k) {
    const el = document.createElement("span");
    el.className = "kg-count";
    el.innerHTML =
      '<span class="swatch" style="background:' + KIND_COLORS[k] + '"></span>' +
      '<span class="num">' + counts[k] + '</span> ' +
      escapeHtml(KIND_LABELS[k]) + (counts[k] === 1 ? "" : "s");
    host.appendChild(el);
  });
})();

/* ---- Build the always-on legend (glowing dot plus kind) ---- */
(function renderLegend() {
  const host = document.getElementById("kgLegend");
  const hint = host.querySelector(".hint");
  KIND_ORDER.forEach(function (k) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<span class="dot" style="background:' + KIND_COLORS[k] + ';color:' + KIND_COLORS[k] + '"></span>' +
      escapeHtml(KIND_LABELS[k]);
    host.insertBefore(row, hint);
  });
})();

/* =============================================================
   Build the graph data the engine consumes.
   - clone nodes/links so the engine can mutate (link.source/target
     become object refs after graphData)
   - attach a per-node color and val for the accessors
   ============================================================= */
const gNodes = DATA.nodes.map(function (n) {
  return {
    id: n.id,
    kind: n.kind,
    name: n.label,
    subtitle: n.subtitle || "",
    body: n.body || "",
    val: (typeof n.val === "number" && n.val > 0) ? n.val : 1,
    color: KIND_COLORS[n.kind] || "#9aa"
  };
});
const gLinks = DATA.links.map(function (l) {
  return { source: l.source, target: l.target, name: l.label || "", weight: l.weight || 1 };
});

const NODE_COUNT = gNodes.length;
const LINK_COUNT = gLinks.length;

/* ---- Degree map (from the raw link ids, before the engine rewrites them) ---- */
const degree = {};
gNodes.forEach(function (n) { degree[n.id] = 0; });
DATA.links.forEach(function (l) {
  if (degree[l.source] !== undefined) degree[l.source] += 1;
  if (degree[l.target] !== undefined) degree[l.target] += 1;
});
function isSoma(node) {
  return node.kind === "agent" || (degree[node.id] || 0) >= SOMA_DEGREE;
}

/* ---- Neighbor adjacency (by id) for hover and highlight ---- */
const neighborIds = {};
const linkPairKey = {};   // "src|tgt" -> true, undirected membership test
gNodes.forEach(function (n) { neighborIds[n.id] = new Set(); });
DATA.links.forEach(function (l) {
  if (neighborIds[l.source]) neighborIds[l.source].add(l.target);
  if (neighborIds[l.target]) neighborIds[l.target].add(l.source);
  linkPairKey[l.source + "|" + l.target] = true;
});

/* =============================================================
   Glow textures: a core gradient and a wide soft halo gradient.
   Cached per color so we build each canvas once.
   ============================================================= */
const coreTexCache = new Map();
const haloTexCache = new Map();

function hexToRgb(hex) {
  let h = String(hex).replace("#", "");
  if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join("");
  const n = parseInt(h, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function rgba(hex, a) {
  const c = hexToRgb(hex);
  return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")";
}

function makeCoreTexture(hex) {
  if (coreTexCache.has(hex)) return coreTexCache.get(hex);
  const size = 128;
  const c = document.createElement("canvas"); c.width = c.height = size;
  const ctx = c.getContext("2d");
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0.00, "rgba(255,250,240,1.00)");
  g.addColorStop(0.14, "rgba(255,250,240,0.95)");
  g.addColorStop(0.34, rgba(hex, 0.72));
  g.addColorStop(0.68, rgba(hex, 0.16));
  g.addColorStop(1.00, rgba(hex, 0.00));
  ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  coreTexCache.set(hex, tex);
  return tex;
}
function makeHaloTexture(hex) {
  if (haloTexCache.has(hex)) return haloTexCache.get(hex);
  const size = 128;
  const c = document.createElement("canvas"); c.width = c.height = size;
  const ctx = c.getContext("2d");
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0.00, "rgba(255,250,240,0.16)");
  g.addColorStop(0.22, rgba(hex, 0.36));
  g.addColorStop(0.58, rgba(hex, 0.14));
  g.addColorStop(1.00, rgba(hex, 0.00));
  ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  haloTexCache.set(hex, tex);
  return tex;
}

/* A small soft round texture used for the edge photons. */
let photonTex = null;
function makePhotonTexture() {
  if (photonTex) return photonTex;
  const size = 64;
  const c = document.createElement("canvas"); c.width = c.height = size;
  const ctx = c.getContext("2d");
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0.0, "rgba(255,245,220,1.0)");
  g.addColorStop(0.4, "rgba(255,225,170,0.55)");
  g.addColorStop(1.0, "rgba(255,225,170,0.0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  photonTex = new THREE.CanvasTexture(c);
  photonTex.colorSpace = THREE.SRGBColorSpace;
  return photonTex;
}

/* Node visual radius. Cube-root of val, agents floored so they stay bright bodies. */
function nodeRadius(node) {
  let r = Math.cbrt(node.val) * 3.35;
  if (node.kind === "agent" && r < 5.8) r = 5.8;
  return r;
}

/* =============================================================
   nodeThreeObject: a Group of
     1) invisible raycast proxy sphere (the only thing the cursor hits)
     2) additive core glow sprite
     3) additive wide halo sprite
     4) an additive accent ring for agents
     5) a persistent SpriteText label, always visible
   ============================================================= */
function buildNodeObject(node) {
  const group = new THREE.Group();
  group.userData.kgNode = node;

  const radius = nodeRadius(node);
  const soma = isSoma(node);
  const hex = node.color;

  // 1) raycast proxy (invisible, generous hit area)
  const proxyGeo = new THREE.SphereGeometry(radius, 16, 16);
  const proxyMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
  const proxy = new THREE.Mesh(proxyGeo, proxyMat);
  group.add(proxy);

  // 2) core glow sprite
  const coreMat = new THREE.SpriteMaterial({
    map: makeCoreTexture(hex),
    color: 0xffffff,
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false
  });
  const core = new THREE.Sprite(coreMat);
  const coreScale = radius * (soma ? 1.6 : 1.1);
  core.scale.set(coreScale, coreScale, 1);
  coreMat.opacity = soma ? 0.98 : 0.88;
  core.userData.baseOpacity = coreMat.opacity;
  core.userData.baseScale = coreScale;
  core.userData.isSoma = soma;
  group.add(core);
  group.userData.core = core;

  // 3) halo glow sprite (wide and faint = the bloom)
  const haloMat = new THREE.SpriteMaterial({
    map: makeHaloTexture(hex),
    color: 0xffffff,
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false
  });
  const halo = new THREE.Sprite(haloMat);
  const haloScale = radius * (soma ? 4.0 : 3.0);
  halo.scale.set(haloScale, haloScale, 1);
  haloMat.opacity = soma ? 0.72 : 0.56;
  group.add(halo);
  group.userData.halo = halo;
  group.userData.haloBaseOpacity = haloMat.opacity;

  // 4) accent ring for agents (the clearest "special node" signal)
  if (node.kind === "agent") {
    const ringOuter = coreScale * 0.62;
    const ringGeo = new THREE.RingGeometry(ringOuter * 0.78, ringOuter, 48);
    const ringMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(hex),
      blending: THREE.AdditiveBlending,
      transparent: true,
      opacity: 0.72,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    // Sprites always face the camera; the ring is flat, so let the engine
    // orient it loosely. It reads as a halo ring from most angles.
    group.add(ring);
  }

  // 5) persistent label (always on)
  const label = new SpriteText(node.name);
  label.color = "#f4f2ea";
  label.backgroundColor = "rgba(13,17,33,0.78)";
  label.padding = 4;
  label.borderRadius = 4;
  label.fontWeight = "500";
  label.fontFace = KIND_LABEL_FONT[node.kind] || "IBM Plex Sans, sans-serif";
  label.textHeight = KIND_LABEL_HEIGHT[node.kind] || 3.4;
  label.material.depthWrite = false;
  label.visible = true;
  label.position.set(0, haloScale * 0.42 + 3.5, 0);
  group.add(label);

  return group;
}

/* =============================================================
   Edge styling tiers. Returns color/opacity/photon params per link
   based on hover and selection state. Priority order matters.
   ============================================================= */
function linkTouchesHighlight(link) {
  if (!highlightSet.size) return false;
  const s = link.source.id || link.source;
  const t = link.target.id || link.target;
  return highlightSet.has(s) && highlightSet.has(t);
}
function linkTouchesNode(link, nodeId) {
  if (!nodeId) return false;
  const s = link.source.id || link.source;
  const t = link.target.id || link.target;
  return s === nodeId || t === nodeId;
}
function linkSomaTouch(link) {
  const s = link.source.id || link.source;
  const t = link.target.id || link.target;
  const ns = NODE_BY_ID[s], nt = NODE_BY_ID[t];
  return (ns && (ns.kind === "agent" || (degree[s] || 0) >= SOMA_DEGREE)) ||
         (nt && (nt.kind === "agent" || (degree[t] || 0) >= SOMA_DEGREE));
}

/* Deterministic hash so the ~33% photon subset and speeds are stable. */
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return h >>> 0;
}
function linkHash(link) {
  const s = link.source.id || link.source;
  const t = link.target.id || link.target;
  return hashStr(s + ">" + t);
}
function plainPhotonOn(link) {
  // about a third of plain edges carry a photon, plus all soma-touching edges
  if (linkSomaTouch(link)) return true;
  return (linkHash(link) % 3) === 0;
}

/* ---- Engine instance ---- */
const elGraph = document.getElementById("kgGraph");
const Graph = new ForceGraph3D(elGraph, { controlType: "orbit", rendererConfig: { antialias: true, alpha: true, powerPreference: "high-performance" } });

let hoverNodeId = null;
let selectedId = null;
let highlightSet = new Set();    // ids in the currently highlighted neighborhood

Graph
  .backgroundColor("#0a0e1c")
  .graphData({ nodes: gNodes, links: gLinks })
  .nodeRelSize(4)
  .nodeVal(function (n) { return n.val; })
  .nodeLabel(function (n) { return ""; })  // we use persistent SpriteText, not the HTML tooltip
  .nodeThreeObject(buildNodeObject)
  .nodeThreeObjectExtend(false)            // replace the default sphere (we draw our own proxy)
  .linkLabel(function (l) { return l.name || ""; })
  .linkColor(linkColor)
  .linkOpacity(0.34)
  .linkWidth(linkWidth)
  .linkDirectionalParticles(linkParticles)
  .linkDirectionalParticleColor(linkParticleColor)
  .linkDirectionalParticleWidth(1.6)
  .linkDirectionalParticleSpeed(0.006)
  .onNodeClick(onNodeClick)
  .onNodeHover(onNodeHover)
  .onBackgroundClick(deselect)
  .d3VelocityDecay(0.32)
  .d3AlphaDecay(0.02)
  .warmupTicks(60)
  .cooldownTicks(400);

/* ---- Link accessor functions (state-aware) ---- */
function linkColor(link) {
  const hovered = hoverNodeId && linkTouchesNode(link, hoverNodeId);
  if (hovered || linkTouchesHighlight(link)) return "#ffd578";      // focused: gold
  if (highlightSet.size && !linkTouchesHighlight(link)) return rgba("#3a4a66", 0.10); // dim others
  if (linkSomaTouch(link)) return rgba("#f4b942", 0.42);            // resting soma edge: amber
  return rgba("#d8cab4", 0.28);                                     // resting plain: muted
}
function linkWidth(link) {
  const hovered = hoverNodeId && linkTouchesNode(link, hoverNodeId);
  if (hovered || linkTouchesHighlight(link)) return 1.4;
  return 0.5;
}
function linkParticles(link) {
  const hovered = hoverNodeId && linkTouchesNode(link, hoverNodeId);
  if (hovered || linkTouchesHighlight(link)) return 4;
  if (highlightSet.size && !linkTouchesHighlight(link)) return 0;   // mute the rest
  return plainPhotonOn(link) ? 2 : 0;
}
function linkParticleColor(link) {
  const hovered = hoverNodeId && linkTouchesNode(link, hoverNodeId);
  if (hovered || linkTouchesHighlight(link)) return "#fff2cc";
  return "#ffd9a0";
}

/* =============================================================
   Hover: brighten the 1-hop neighborhood, dim the rest. Re-apply
   accessors by calling them again so the engine restyles links.
   ============================================================= */
function onNodeHover(node) {
  const id = node ? node.id : null;
  if (id === hoverNodeId) return;
  hoverNodeId = id;
  document.body.style.cursor = node ? "pointer" : "";
  refreshLinkStyles();
  applyNodeEmphasis();
}

/* Recompute the visual emphasis on every node group based on hover/selection. */
function applyNodeEmphasis() {
  // Which ids are "lit": selection neighborhood wins; otherwise hover neighborhood.
  let lit = null;
  if (highlightSet.size) lit = highlightSet;
  else if (hoverNodeId) {
    lit = new Set([hoverNodeId]);
    neighborIds[hoverNodeId].forEach(function (x) { lit.add(x); });
  }

  Graph.graphData().nodes.forEach(function (n) {
    const grp = n.__threeObj;
    if (!grp) return;
    const core = grp.userData.core;
    const halo = grp.userData.halo;
    if (!core || !halo) return;

    let mul = 1.0;          // brightness multiplier
    if (lit) mul = lit.has(n.id) ? 1.0 : 0.22;

    core.material.opacity = core.userData.baseOpacity * mul;
    halo.material.opacity = grp.userData.haloBaseOpacity * mul;
  });
}

/* Force the link accessors to re-evaluate by re-setting them. */
function refreshLinkStyles() {
  Graph
    .linkColor(linkColor)
    .linkWidth(linkWidth)
    .linkDirectionalParticles(linkParticles)
    .linkDirectionalParticleColor(linkParticleColor);
}

/* =============================================================
   Click: fly the camera to frame the node, build the highlight set
   (node + 1-hop), open the inspector.
   ============================================================= */
function onNodeClick(node) {
  if (!node) return;
  flyTo(node);
  selectedId = node.id;
  highlightSet = new Set([node.id]);
  neighborIds[node.id].forEach(function (x) { highlightSet.add(x); });
  refreshLinkStyles();
  applyNodeEmphasis();
  openInspector(node.id);
  // pause auto-rotate while focused
  pauseAutoRotate();
}

function flyTo(node) {
  const dist = 120;
  const d = Math.hypot(node.x || 0, node.y || 0, node.z || 0) || 1;
  const r = 1 + dist / d;
  Graph.cameraPosition(
    { x: (node.x || 0) * r, y: (node.y || 0) * r, z: (node.z || 0) * r },
    { x: node.x || 0, y: node.y || 0, z: node.z || 0 },
    1400
  );
}

function deselect() {
  selectedId = null;
  highlightSet = new Set();
  refreshLinkStyles();
  applyNodeEmphasis();
  closeInspector();
  resumeAutoRotateSoon();
}

/* Reset view: deselect and zoom to fit the whole graph. */
function resetView() {
  deselect();
  Graph.zoomToFit(900, 60);
}

/* =============================================================
   Inspector (plain DOM). Name, kind, subtitle, body, grouped
   clickable connections that re-focus the chosen node.
   ============================================================= */
function openInspector(id) {
  const n = NODE_BY_ID[id];
  if (!n) return;

  const insp = document.getElementById("kgInspector");
  const app = document.getElementById("kgApp");
  const color = KIND_COLORS[n.kind] || "#9aa";

  document.getElementById("kgInspKind").innerHTML =
    '<span class="dot" style="background:' + color + '"></span>' + escapeHtml(KIND_LABELS[n.kind] || n.kind);
  document.getElementById("kgInspName").textContent = n.label;
  const sub = document.getElementById("kgInspSubtitle");
  if (n.subtitle) { sub.textContent = n.subtitle; sub.style.display = ""; }
  else { sub.style.display = "none"; }

  const body = document.getElementById("kgInspBody");
  let html = "";
  if (n.body) html += '<p class="copy">' + escapeHtml(n.body) + "</p>";
  else html += '<p class="empty">No description on this node yet.</p>';

  const out = [];
  const inc = [];
  DATA.links.forEach(function (l) {
    if (l.source === id) out.push({ otherId: l.target, rel: l.label || "linked" });
    if (l.target === id) inc.push({ otherId: l.source, rel: l.label || "linked" });
  });

  html += renderConnGroup("Connects to", out);
  html += renderConnGroup("Connected from", inc);
  if (out.length === 0 && inc.length === 0) {
    html += '<p class="empty">No connections in this view.</p>';
  }

  body.innerHTML = html;

  Array.prototype.forEach.call(body.querySelectorAll(".kg-conn"), function (btn) {
    btn.addEventListener("click", function () {
      const otherId = btn.getAttribute("data-id");
      const target = NODE_BY_ID[otherId];
      const liveNode = Graph.graphData().nodes.find(function (x) { return x.id === otherId; });
      if (liveNode) onNodeClick(liveNode);
    });
  });

  insp.classList.add("is-open");
  insp.setAttribute("aria-hidden", "false");
  app.classList.add("insp-open");
}

function renderConnGroup(title, list) {
  if (!list.length) return "";
  let html = '<div class="kg-conn-group"><h5>' + escapeHtml(title) + " (" + list.length + ")</h5>";
  list.forEach(function (c) {
    const other = NODE_BY_ID[c.otherId];
    if (!other) return;
    const color = KIND_COLORS[other.kind] || "#9aa";
    html +=
      '<button class="kg-conn" type="button" data-id="' + escapeHtml(other.id) + '">' +
        '<span class="dot" style="background:' + color + '"></span>' +
        '<span class="label">' + escapeHtml(other.label) + "</span>" +
        '<span class="rel">' + escapeHtml(c.rel) + "</span>" +
      "</button>";
  });
  html += "</div>";
  return html;
}

function closeInspector() {
  const insp = document.getElementById("kgInspector");
  insp.classList.remove("is-open");
  insp.setAttribute("aria-hidden", "true");
  document.getElementById("kgApp").classList.remove("insp-open");
}

document.getElementById("kgClose").addEventListener("click", deselect);
document.getElementById("kgReset").addEventListener("click", resetView);

/* =============================================================
   Search: type-ahead. Selecting a result flies the camera and
   opens the inspector.
   ============================================================= */
(function wireSearch() {
  const input = document.getElementById("kgSearch");
  const suggest = document.getElementById("kgSuggest");
  let activeIdx = -1;
  let matches = [];

  function close() {
    suggest.classList.remove("is-open");
    suggest.innerHTML = "";
    activeIdx = -1;
    matches = [];
  }

  function pick(id) {
    input.value = NODE_BY_ID[id] ? NODE_BY_ID[id].label : "";
    close();
    const liveNode = Graph.graphData().nodes.find(function (x) { return x.id === id; });
    if (liveNode) onNodeClick(liveNode);
  }

  function render(q) {
    const needle = q.trim().toLowerCase();
    if (!needle) { close(); return; }
    matches = DATA.nodes.filter(function (n) {
      return n.label.toLowerCase().indexOf(needle) !== -1 ||
             (n.subtitle && n.subtitle.toLowerCase().indexOf(needle) !== -1);
    }).slice(0, 8);

    if (!matches.length) { close(); return; }

    suggest.innerHTML = "";
    matches.forEach(function (n, i) {
      const li = document.createElement("li");
      li.setAttribute("role", "option");
      li.setAttribute("data-id", n.id);
      if (i === activeIdx) li.classList.add("is-active");
      li.innerHTML =
        '<span class="dot" style="background:' + (KIND_COLORS[n.kind] || "#9aa") + '"></span>' +
        escapeHtml(n.label) +
        '<span class="k">' + escapeHtml(KIND_LABELS[n.kind] || n.kind) + "</span>";
      li.addEventListener("click", function () { pick(n.id); });
      suggest.appendChild(li);
    });
    suggest.classList.add("is-open");
  }

  input.addEventListener("input", function () { activeIdx = -1; render(input.value); });
  input.addEventListener("focus", function () { if (input.value) render(input.value); });

  input.addEventListener("keydown", function (e) {
    if (!matches.length) {
      if (e.key === "Enter" && input.value.trim()) {
        const needle = input.value.trim().toLowerCase();
        const hit = DATA.nodes.find(function (n) {
          return n.label.toLowerCase().indexOf(needle) !== -1;
        });
        if (hit) pick(hit.id);
      }
      return;
    }
    if (e.key === "ArrowDown") {
      e.preventDefault();
      activeIdx = (activeIdx + 1) % matches.length;
      render(input.value);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      activeIdx = (activeIdx - 1 + matches.length) % matches.length;
      render(input.value);
    } else if (e.key === "Enter") {
      e.preventDefault();
      const idx = activeIdx >= 0 ? activeIdx : 0;
      pick(matches[idx].id);
    } else if (e.key === "Escape") {
      close();
      input.blur();
    }
  });

  document.addEventListener("click", function (e) {
    if (!e.target.closest(".kg-search")) close();
  });
})();

/* =============================================================
   Scene polish after mount: fog at the bg color, strip the default
   lights down to one faint ambient, start a slow auto-rotate that
   pauses on user interaction and resumes when idle.
   ============================================================= */
let controls = null;
let autoRotateResumeTimer = null;

function pauseAutoRotate() {
  if (controls) controls.autoRotate = false;
  clearTimeout(autoRotateResumeTimer);
}
function resumeAutoRotateSoon() {
  clearTimeout(autoRotateResumeTimer);
  autoRotateResumeTimer = setTimeout(function () {
    if (controls && !selectedId) controls.autoRotate = true;
  }, 4000);
}

setTimeout(function () {
  const scene = Graph.scene();
  const camera = Graph.camera();
  controls = Graph.controls();

  // Depth fog: distant nodes dissolve into the void.
  scene.fog = new THREE.FogExp2(0x0a0e1c, 0.00145);

  // Strip library lights; the glow is all additive sprites. One faint ambient.
  const toRemove = [];
  scene.traverse(function (o) {
    if (o.isLight) toRemove.push(o);
  });
  toRemove.forEach(function (l) { if (l.parent) l.parent.remove(l); });
  scene.add(new THREE.AmbientLight(0x9aaccc, 0.16));

  // Calm auto-rotate with smooth damping.
  if (controls) {
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;   // slow, calm
    controls.enableDamping = true;
    controls.dampingFactor = 0.12;
    controls.update();
  }

  // Start the camera pulled back a little.
  camera.position.z = 320;

  // Pause auto-rotate the moment the user touches the scene; resume when idle.
  const dom = Graph.renderer().domElement;
  ["pointerdown", "wheel", "touchstart"].forEach(function (ev) {
    dom.addEventListener(ev, function () { pauseAutoRotate(); }, { passive: true });
  });
  ["pointerup", "touchend"].forEach(function (ev) {
    dom.addEventListener(ev, function () { resumeAutoRotateSoon(); }, { passive: true });
  });
  dom.addEventListener("mouseleave", function () { resumeAutoRotateSoon(); }, { passive: true });
}, 300);

/* =============================================================
   Continuous render loop, separate from the simulation tick:
   a gentle pulse on the focused / hovered node so the graph keeps
   shimmering even when the layout has frozen.
   ============================================================= */
(function pulseLoop() {
  function tick() {
    if (!document.hidden) {
      const t = performance.now() / 1000;
      const pulse = 0.55 + Math.sin(t * Math.PI * 2 * 0.6) * 0.45; // 0.1 .. 1.0

      const focusId = selectedId || hoverNodeId;
      if (focusId) {
        const n = Graph.graphData().nodes.find(function (x) { return x.id === focusId; });
        const grp = n && n.__threeObj;
        if (grp && grp.userData.core) {
          const core = grp.userData.core;
          const soma = core.userData.isSoma;
          const opBoost = soma ? 0.2 : 0.12;
          const scBoost = soma ? 0.18 : 0.12;
          core.material.opacity = Math.min(1, core.userData.baseOpacity + opBoost * pulse);
          const s = core.userData.baseScale * (1 + scBoost * pulse);
          core.scale.set(s, s, 1);
        }
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* =============================================================
   Resize handling and initial fit + loader hide.
   ============================================================= */
function sizeGraph() {
  Graph.width(elGraph.clientWidth);
  Graph.height(elGraph.clientHeight);
}
window.addEventListener("resize", function () {
  clearTimeout(window.__kgResizeTimer);
  window.__kgResizeTimer = setTimeout(sizeGraph, 160);
});
sizeGraph();

// Fit once the engine has settled a bit, then hide the loader.
Graph.onEngineStop(function () {
  // onEngineStop fires when the layout cools. Fit only the first time.
  if (!window.__kgFitted) {
    window.__kgFitted = true;
    Graph.zoomToFit(800, 60);
  }
});
setTimeout(function () {
  const loader = document.getElementById("kgLoading");
  loader.classList.add("is-hidden");
  setTimeout(function () { loader.style.display = "none"; }, 450);
}, 1200);

// Expose a debug handle (avoid window.cy-style id collisions).
window.__kg = { Graph: Graph, select: onNodeClick, deselect: deselect, reset: resetView };
</script>
